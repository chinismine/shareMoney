<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>ShareMoney 記帳</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #06C755;
      --primary-dark: #05a044;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --input-bg: #f9fafb;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .profile-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #eee;
      margin-right: 16px;
      object-fit: cover;
    }

    .profile-info h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .profile-info p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      max-width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background-color: var(--input-bg);
      font-size: 16px;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    input[type="datetime-local"].form-control {
      display: block;
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.1);
      background-color: #fff;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .category-card {
      position: relative;
    }

    .category-card input {
      display: none;
    }

    .category-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background-color: var(--card-bg);
      cursor: pointer;
      transition: all 0.2s;
    }

    .category-content span.emoji {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .category-content span.text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .category-card input:checked+.category-content {
      border-color: var(--primary);
      background-color: rgba(6, 199, 85, 0.05);
    }

    .category-card input:checked+.category-content span.text {
      color: var(--primary);
      font-weight: 700;
    }

    .input-group {
      display: flex;
      gap: 12px;
    }

    .currency-select {
      width: 100px;
      flex-shrink: 0;
    }

    .amount-input {
      flex-grow: 1;
      font-family: monospace;
      font-size: 18px;
    }

    .checkbox-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkbox-label input {
      margin-right: 10px;
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
    }

    .checkbox-label:has(input:checked) {
      border-color: var(--primary);
      background-color: rgba(6, 199, 85, 0.02);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.2);
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
    }

    .group-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .group-item:hover {
      border-color: var(--primary);
    }
    
    .group-item-name {
      font-size: 16px;
      font-weight: 600;
    }
    
    .group-item-arrow {
      color: var(--primary);
      font-weight: bold;
    }

    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: white;
      display: flex;
      box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
      border-top: 1px solid var(--border);
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-item.active {
      color: var(--primary);
      border-top: 3px solid var(--primary);
      margin-top: -1px;
      background-color: rgba(6, 199, 85, 0.05);
    }
    .nav-item i {
      font-size: 20px;
      display: block;
      margin-bottom: 4px;
    }

    .fab {
      position: fixed;
      bottom: 90px;
      right: calc(50% - 220px); 
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 4px 16px rgba(6, 199, 85, 0.4);
      cursor: pointer;
      z-index: 900;
      transition: transform 0.2s;
    }
    
    @media (max-width: 480px) {
      .fab {
        right: 20px;
      }
    }
    
    .fab:hover {
      transform: scale(1.05);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .currency-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .currency-tab {
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .currency-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(6,199,85,0.3);
    }
    
    .history-card {
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 16px; 
      margin-bottom: 12px; 
      cursor: pointer; 
      transition: all 0.2s;
    }
    .history-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(6,199,85,0.1);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="app-container">

    <!-- 視圖 1：載入中 -->
    <div id="loadingView" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px;">
      <div class="spinner"></div>
      <h2 id="loadingText" style="color: var(--text-muted); font-size: 16px;">系統初始化中...</h2>
    </div>

    <!-- 視圖 2：大廳 (我的群組) -->
    <div id="lobbyView" style="display: none;">
      <div class="header">
        <img id="lobbyProfileImg" class="profile-img" src="https://via.placeholder.com/150" alt="Profile">
        <div class="profile-info">
          <h1 id="lobbyProfileName">載入中...</h1>
          <p>我的記帳群組</p>
        </div>
      </div>
      
      <div id="groupList" style="margin-bottom: 24px; max-height: 400px; overflow-y: auto;">
        <!-- 群組列表渲染在這裡 -->
      </div>
      
      <button type="button" class="btn btn-primary" onclick="createGroup()">
        + 建立新群組
      </button>
    </div>

    <!-- 視圖 3：群組記帳表單 (作為覆蓋頁面) -->
    <div id="groupView" style="display: none; padding-bottom: 20px;">
      <div class="header" style="justify-content: space-between;">
        <div style="display: flex; align-items: center;">
          <button type="button" onclick="switchTab(currentTab, true)" style="background:none; border:none; color:var(--text-muted); font-size: 16px; margin-right: 12px; cursor: pointer; padding: 0; font-weight:bold;">
            ✖ 取消
          </button>
          <div class="profile-info">
            <h1 id="headerGroupName">群組名稱</h1>
            <p id="formTitle">新增記帳</p>
          </div>
        </div>
      </div>

      <form id="expenseForm">
        <!-- 編輯模式專用的隱藏欄位 -->
        <input type="hidden" id="editExpenseId" name="editExpenseId" value="">
        
        <div class="form-group">
          <label class="form-label">時間</label>
          <input type="datetime-local" id="time" name="time" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label">品項類別</label>
          <div class="category-grid">
            <label class="category-card"><input type="radio" name="category" value="🍺飲食" checked><div class="category-content"><span class="emoji">🍺</span><span class="text">飲食</span></div></label>
            <label class="category-card"><input type="radio" name="category" value="🚌交通"><div class="category-content"><span class="emoji">🚌</span><span class="text">交通</span></div></label>
            <label class="category-card"><input type="radio" name="category" value="👜購物"><div class="category-content"><span class="emoji">👜</span><span class="text">購物</span></div></label>
            <label class="category-card"><input type="radio" name="category" value="🎁禮物"><div class="category-content"><span class="emoji">🎁</span><span class="text">禮物</span></div></label>
            <label class="category-card"><input type="radio" name="category" value="🏨住宿"><div class="category-content"><span class="emoji">🏨</span><span class="text">住宿</span></div></label>
            <label class="category-card"><input type="radio" name="category" value="🆗其他"><div class="category-content"><span class="emoji">🆗</span><span class="text">其他</span></div></label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="item">品項名稱</label>
          <input type="text" id="item" name="item" class="form-control" placeholder="例如：晚餐拉麵" required>
        </div>

        <div class="form-group">
          <label class="form-label">消費金額</label>
          <div class="input-group">
            <select name="currency" id="currency" class="form-control currency-select">
              <option value="TWD">TWD</option>
              <option value="JPY">JPY</option>
              <option value="KRW">KRW</option>
              <option value="USD">USD</option>
            </select>
            <input type="number" id="amount" name="amount" class="form-control amount-input" placeholder="0" required min="0">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="payer">誰先付錢？（代墊者）</label>
          <select id="payer" name="payer" class="form-control">
            <option value="公費">🌟 公費支付</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">如何分攤？（參與者）</label>
          <div class="checkbox-list" id="splitUsers"></div>
          <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">預設為勾選者平均分攤</p>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label class="form-label" for="notes" style="margin-bottom: 0;">備註 (可選)</label>
            <button type="button" onclick="document.getElementById('receiptImageInput').click()" style="background:#e0e7ff; color:#4f46e5; border:none; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:4px;">
              ✨ AI 掃描發票
            </button>
            <input type="file" id="receiptImageInput" accept="image/*" style="display:none" onchange="handleReceiptUpload(event)">
          </div>
          <textarea id="notes" name="notes" class="form-control" placeholder="可在此輸入備註，或點擊上方掃描發票自動帶入" rows="3" style="resize:vertical;"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">送出記帳</button>
      </form>
    </div>

    <!-- 視圖 4：結算儀表板 -->
    <div id="settlementView" style="display: none; padding-bottom: 80px;">
      <div class="header" style="justify-content: space-between;">
        <div style="display: flex; align-items: center;">
          <button type="button" onclick="loadMyGroups()" style="background:none; border:none; color:var(--primary); font-size: 16px; margin-right: 12px; cursor: pointer; padding: 0;">
            ← 返回
          </button>
          <div class="profile-info">
            <h1 id="settlementGroupName">群組名稱</h1>
            <p>結算儀表板</p>
          </div>
        </div>
        <button type="button" onclick="shareGroup('settlement')" style="background:var(--primary); color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight: bold; font-size: 13px;">
          分享連結
        </button>
      </div>

      <!-- 多幣別切換 Tabs -->
      <div id="currencyTabsContainer" class="currency-tabs"></div>

      <!-- 統計卡片 -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
        <div style="background: var(--input-bg); padding: 16px; border-radius: 12px; text-align: center; border: 1px solid var(--border);">
          <p style="margin: 0 0 8px; font-size: 12px; color: var(--text-muted);">群組總花費</p>
          <h2 id="totalExpenseAmount" style="margin: 0; font-size: 20px; color: var(--text-main);">0</h2>
        </div>
        <div style="background: rgba(6, 199, 85, 0.05); padding: 16px; border-radius: 12px; text-align: center; border: 1px solid var(--primary);">
          <p style="margin: 0 0 8px; font-size: 12px; color: var(--primary);">公費結餘</p>
          <h2 id="publicFundAmount" style="margin: 0; font-size: 20px; color: var(--primary);">0</h2>
        </div>
      </div>
      
      <!-- 個人花費卡片 -->
      <div style="background: #fff8e1; padding: 16px; border-radius: 12px; text-align: center; border: 1px solid #ffe082; margin-bottom: 24px;">
        <p style="margin: 0 0 8px; font-size: 13px; color: #b08d00; font-weight: 600;">🧍 我的個人總花費</p>
        <h2 id="personalExpenseAmount" style="margin: 0; font-size: 26px; color: #b08d00;">0</h2>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px;">
        <h3 style="font-size: 16px; margin: 0;">成員淨餘額</h3>
        <span style="font-size:12px; color:var(--text-muted);">正數=應收款 / 負數=應付款</span>
      </div>
      
      <div id="balancesList"></div>
    </div>

    <!-- 視圖 5：歷史紀錄列表 -->
    <div id="historyView" style="display: none; padding-bottom: 80px;">
      <div class="header" style="justify-content: space-between;">
        <div style="display: flex; align-items: center;">
          <button type="button" onclick="loadMyGroups()" style="background:none; border:none; color:var(--primary); font-size: 16px; margin-right: 12px; cursor: pointer; padding: 0;">
            ← 返回
          </button>
          <div class="profile-info">
            <h1 id="historyGroupName">群組名稱</h1>
            <p>歷史記帳紀錄</p>
          </div>
        </div>
        <button type="button" onclick="shareGroup('history')" style="background:var(--input-bg); color:var(--text-main); border:1px solid var(--border); padding:8px 12px; border-radius:8px; cursor:pointer; font-weight: bold; font-size: 13px;">
          傳送紀錄連結
        </button>
      </div>
      
      <div id="expensesList"></div>
    </div>

    <!-- 全域懸浮記帳按鈕 -->
    <div id="globalFab" class="fab" onclick="showExpenseForm()" style="display: none;">+</div>

    <!-- 底部導覽列 -->
    <div id="bottomNav" class="bottom-nav" style="display: none;">
      <div class="nav-item active" id="nav-settlement" onclick="switchTab('settlement')">
        <i>💰</i>
        結算面板
      </div>
      <div class="nav-item" id="nav-history" onclick="switchTab('history')">
        <i>📄</i>
        記帳紀錄
      </div>
    </div>

  </div>

  <!-- 滿版 Loading 遮罩 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <h2 id="overlayText" style="color: var(--text-main); font-size: 18px;">處理中...</h2>
  </div>

  <!-- 轉帳/儲值公費 Modal -->
  <div id="transferModal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-top:0;">轉帳還款</h2>
      <p id="modalDesc" style="color:var(--text-muted); font-size:14px; margin-bottom: 20px;">請輸入金額：</p>
      
      <div class="form-group">
        <label class="form-label" id="modalCurrencyLabel">金額 (TWD)</label>
        <input type="number" id="transferAmount" class="form-control" placeholder="0" min="1">
      </div>
      
      <div id="settleAllCheckboxContainer" style="margin-top: 16px; margin-bottom: 16px;">
        <label style="display:flex; align-items:center; cursor:pointer; font-size:14px; color:var(--text-main); font-weight:500;">
          <input type="checkbox" id="settleAllItemsCheckbox" checked style="margin-right:8px; accent-color:var(--primary); width:18px; height:18px;">
          ☑️ 同時將我們所有的未結帳目標記為已結清
        </label>
        <p style="font-size:12px; color:var(--text-muted); margin:4px 0 0 26px;">打勾後，這筆轉帳會自動結清分帳表中您與對方之間所有還沒付清的單筆項目。</p>
      </div>
      
      <div style="display:flex; gap:12px; margin-top:24px;">
        <button class="btn" style="background:#eee; color:#333; padding: 12px;" onclick="closeTransferModal()">取消</button>
        <button class="btn btn-primary" style="padding: 12px;" onclick="submitTransfer()">確認送出</button>
      </div>
    </div>
  </div>

  <!-- 第八階段：歷史帳目詳細與個別結清 Modal -->
  <div id="expenseDetailModal" class="modal-overlay">
    <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
      <h2 id="detailItem" style="margin-top:0; font-size: 20px;">項目名稱</h2>
      <div style="font-size:24px; font-weight:bold; color:var(--text-main); font-family:monospace; margin-bottom:16px;">
        <span id="detailAmount">0</span> <span id="detailCurrency" style="font-size:14px;">TWD</span>
      </div>
      <p style="margin:0 0 8px; font-size:14px; color:var(--text-muted);" id="detailTime">時間</p>
      <p style="margin:0 0 16px; font-size:14px; color:var(--text-muted);" id="detailPayer">代墊：</p>
      
      <div id="detailNotes" style="display:none; padding:12px; background:var(--input-bg); border-radius:8px; font-size:13px; color:#555; margin-bottom:16px; word-break:break-all; white-space:pre-wrap;"></div>
      
      <h3 style="font-size:15px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border);">分攤成員與結清狀態</h3>
      <div id="detailSplitsList" style="margin-bottom: 24px;"></div>
      
      <div style="display:flex; gap:12px; margin-top:24px;">
        <button class="btn" style="background:#fee2e2; color:#ef4444; padding: 12px; flex:1;" id="btnDeleteExpense">🗑️ 刪除</button>
        <button class="btn" style="background:#e0f2fe; color:#0ea5e9; padding: 12px; flex:1;" id="btnEditExpense">✏️ 編輯</button>
      </div>
      <button class="btn" style="background:#eee; color:#333; padding: 12px; margin-top:12px;" onclick="document.getElementById('expenseDetailModal').style.display='none'">關閉視窗</button>
    </div>
  </div>

  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const LIFF_ID = "2010102708-QAKS09Tj";
    // 您的最新 GAS 部署網址
    const API_URL = "https://script.google.com/macros/s/AKfycbwgoMHDMxind-iTulXtzrN631CHoa7UeTWzr8oZS6FJCglAayr4UK386PjU8CsBFs0d/exec";

    let currentUser = null;
    let currentGroupId = null;
    let currentGroupName = null;
    let groupMembers = [];
    
    // 多幣別與極速快取架構
    let currentSettlementData = {}; 
    let cachedExpenses = [];
    let currentCurrency = 'TWD';
    let currentTransferTarget = null;
    let currentTab = 'settlement'; 

    function initDateTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('time').value = now.toISOString().slice(0, 16);
    }
    function setMainLoadingText(text) {
      document.getElementById('loadingView').style.display = 'flex';
      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('groupView').style.display = 'none';
      document.getElementById('settlementView').style.display = 'none';
      document.getElementById('historyView').style.display = 'none';
      document.getElementById('bottomNav').style.display = 'none';
      document.getElementById('globalFab').style.display = 'none';
      document.getElementById('loadingText').innerText = text;
    }

    function toggleOverlay(show, text = '處理中...') {
      document.getElementById('overlayText').innerText = text;
      document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    }

    async function apiCall(action, data) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: action, data: data }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        return await response.json();
      } catch (e) {
        alert("網路發生錯誤: " + e.message);
        return { success: false, message: e.message };
      }
    }

    async function initializeApp() {
      setMainLoadingText("連線至 LINE...");
      try {
        await liff.init({ liffId: LIFF_ID });
        
        if (liff.isLoggedIn() || liff.isInClient()) {
          const profile = await liff.getProfile();
          currentUser = {
            userId: profile.userId,
            displayName: profile.displayName,
            pictureUrl: profile.pictureUrl
          };
        } else {
          currentUser = { userId: "Uba285443d55c8e40a483a7ad70833322", displayName: "網頁測試員", pictureUrl: "https://via.placeholder.com/150" };
        }

        document.getElementById('lobbyProfileImg').src = currentUser.pictureUrl || 'https://via.placeholder.com/150';
        document.getElementById('lobbyProfileName').innerText = currentUser.displayName;

        const urlParams = new URLSearchParams(window.location.search);
        let inviteGroupId = urlParams.get('groupId');
        if (!inviteGroupId && liff.getContext() && liff.getContext().endpointUrl) {
           const endpointParams = new URLSearchParams(new URL(liff.getContext().endpointUrl).search);
           inviteGroupId = endpointParams.get('groupId');
        }

        // --- 新增功能：自動記憶最後進入的群組 ---
        if (!inviteGroupId) {
          inviteGroupId = localStorage.getItem('lastShareMoneyGroupId');
        }

        if (inviteGroupId) {
          await enterGroup(inviteGroupId, '載入中...');
        } else {
          setMainLoadingText("正在載入您的群組...");
          await loadMyGroups();
        }
      } catch (err) {
        alert("LIFF 初始化失敗: " + err.message);
      }
    }

    async function loadMyGroups() {
      setMainLoadingText("正在載入群組列表...");
      const res = await apiCall('getMyGroups', { userId: currentUser.userId });
      
      if (res.success) {
        const listDiv = document.getElementById('groupList');
        listDiv.innerHTML = '';
        
        if (res.groups.length === 0) {
          listDiv.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px 0;">您目前還沒有任何記帳群組喔！<br>趕快點擊下方按鈕建立一個吧。</p>';
        } else {
          res.groups.forEach(g => {
            const item = document.createElement('div');
            item.className = 'group-item';
            item.onclick = () => enterGroup(g.groupId, g.groupName);
            item.innerHTML = `
              <span class="group-item-name">🏠 ${g.groupName}</span>
              <span class="group-item-arrow">進入 ➔</span>
            `;
            listDiv.appendChild(item);
          });
        }
        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('lobbyView').style.display = 'block';
        document.getElementById('groupView').style.display = 'none';
        document.getElementById('settlementView').style.display = 'none';
        document.getElementById('historyView').style.display = 'none';
        document.getElementById('bottomNav').style.display = 'none';
        document.getElementById('globalFab').style.display = 'none';
      } else {
        alert("載入群組失敗：" + res.message);
      }
    }

    async function createGroup() {
      const name = prompt("為您的新群組取個名字吧！（例如：日本京阪神之旅）");
      if (!name || name.trim() === "") return;
      
      toggleOverlay(true, "正在建立群組...");
      const res = await apiCall('createGroup', {
        groupName: name.trim(),
        userId: currentUser.userId,
        userName: currentUser.displayName
      });
      
      toggleOverlay(false);
      if (res.success) {
        enterGroup(res.groupId, name);
      } else {
        alert("建立失敗：" + res.message);
      }
    }

    // --- 極速載入邏輯 (合併 API) ---
    async function enterGroup(groupId, groupName) {
      currentGroupId = groupId;
      localStorage.setItem('lastShareMoneyGroupId', groupId);
      setMainLoadingText(`正在進入 ${groupName}...`);
      currentGroupId = groupId;
      currentGroupName = groupName;
      
      document.getElementById('headerGroupName').innerText = groupName;
      document.getElementById('settlementGroupName').innerText = groupName;
      document.getElementById('historyGroupName').innerText = groupName;
      
      const res = await apiCall('enterGroupInit', { 
        groupId: groupId, 
        userId: currentUser.userId,
        userName: currentUser.displayName 
      });
      
      if (res.success) {
        currentGroupName = res.groupName;
        document.getElementById('headerGroupName').innerText = res.groupName;
        document.getElementById('settlementGroupName').innerText = res.groupName;
        document.getElementById('historyGroupName').innerText = res.groupName;
        
        groupMembers = res.members;
        renderMembersDropdown();
        
        currentSettlementData = res.settlement;
        cachedExpenses = res.expenses;
        
        const urlParams = new URLSearchParams(window.location.search);
        let endpointParams = null;
        try {
          if (liff.getContext() && liff.getContext().endpointUrl) {
            endpointParams = new URLSearchParams(new URL(liff.getContext().endpointUrl).search);
          }
        } catch(e) { console.error("解析 endpointUrl 失敗", e); }
        
        // 優先讀取網址列參數，若無則退回檢查 endpointUrl
        const getParam = (key) => {
          const val = urlParams.get(key);
          if (val !== null) return val;
          return endpointParams ? endpointParams.get(key) : null;
        };
        
        const initView = getParam('view') || 'settlement';
        switchTab(initView, true);
        
        // --- 第十一階段：URL 參數自動帶入 (捷徑功能) ---
        // 必須在 switchTab 之後執行，因為 switchTab('form') 會執行 showExpenseForm 並重置表單
        if (initView === 'form') {
          const itemParam = getParam('item');
          const amountParam = getParam('amount');
          const notesParam = getParam('notes');
          const payerParam = getParam('payer'); 
          const currencyParam = getParam('currency');
          
          if (itemParam) document.getElementById('item').value = itemParam;
          if (amountParam) document.getElementById('amount').value = amountParam;
          if (notesParam) document.getElementById('notes').value = notesParam;
          
          if (currencyParam) {
            const currencySelect = document.getElementById('currency');
            currencySelect.value = currencyParam.toUpperCase(); 
          }
          
          if (payerParam === 'public') {
            document.getElementById('payer').value = '公費';
          } else if (payerParam === 'me') {
            document.getElementById('payer').value = currentUser.userId;
          }
          
          // 帶入完成後，清除網址參數，避免重整時重複帶入
          if (itemParam || amountParam || notesParam || payerParam || currencyParam) {
             window.history.replaceState({}, document.title, window.location.pathname);
          }
        }
      } else {
        alert("載入群組失敗：" + res.message);
        loadMyGroups();
      }
    }

    function renderMembersDropdown() {
      const payerSelect = document.getElementById('payer');
      const splitUsersDiv = document.getElementById('splitUsers');
      
      payerSelect.innerHTML = '<option value="公費">🌟 公費支付</option>';
      splitUsersDiv.innerHTML = '';
      
      groupMembers.forEach(member => {
        const option = document.createElement('option');
        option.value = member.userId;
        option.text = member.userName + (member.userId === currentUser.userId ? ' (我)' : '');
        if (member.userId === currentUser.userId) option.selected = true;
        payerSelect.appendChild(option);
        
        const label = document.createElement('label');
        label.className = 'checkbox-label';
        label.innerHTML = `
          <input type="checkbox" name="splitUsers" value="${member.userId}" checked>
          <span>${member.userName}</span>
        `;
        splitUsersDiv.appendChild(label);
      });
    }

    // --- 導覽列與畫面切換邏輯 ---
    function switchTab(tab, useCache = false) {
      // 先隱藏載入畫面
      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('lobbyView').style.display = 'none';
      
      if (tab === 'form') {
        showExpenseForm();
        return;
      }
      
      currentTab = tab;
      document.getElementById('groupView').style.display = 'none';
      document.getElementById('bottomNav').style.display = 'flex';
      document.getElementById('globalFab').style.display = 'flex';

      if (tab === 'settlement') {
        document.getElementById('settlementView').style.display = 'block';
        document.getElementById('historyView').style.display = 'none';
        document.getElementById('nav-settlement').classList.add('active');
        document.getElementById('nav-history').classList.remove('active');
        if (useCache) renderSettlementTabsAndData();
        else loadSettlementData();
      } else if (tab === 'history') {
        document.getElementById('settlementView').style.display = 'none';
        document.getElementById('historyView').style.display = 'block';
        document.getElementById('nav-settlement').classList.remove('active');
        document.getElementById('nav-history').classList.add('active');
        if (useCache) renderExpensesData(cachedExpenses);
        else loadExpensesData();
      }
    }

    function showExpenseForm(isEdit = false) {
      document.getElementById('settlementView').style.display = 'none';
      document.getElementById('historyView').style.display = 'none';
      document.getElementById('bottomNav').style.display = 'none';
      document.getElementById('globalFab').style.display = 'none';
      document.getElementById('expenseDetailModal').style.display = 'none';
      
      if (!isEdit) {
        document.getElementById('expenseForm').reset();
        document.getElementById('editExpenseId').value = '';
        initDateTime();
        document.getElementById('formTitle').innerText = '新增記帳';
      } else {
        document.getElementById('formTitle').innerText = '編輯記帳';
      }
      
      document.getElementById('groupView').style.display = 'block';
    }

    // --- 結算與貨幣邏輯 ---
    async function loadSettlementData() {
      toggleOverlay(true, "計算結算中...");
      const res = await apiCall('getSettlement', { groupId: currentGroupId, userId: currentUser.userId });
      toggleOverlay(false);
      
      if (res.success) {
        currentSettlementData = res.currencies;
        renderSettlementTabsAndData();
      } else {
        alert("載入結算失敗：" + res.message);
      }
    }
    
    function renderSettlementTabsAndData() {
        const tabsContainer = document.getElementById('currencyTabsContainer');
        tabsContainer.innerHTML = '';
        
        const availableCurrencies = Object.keys(currentSettlementData);
        if (availableCurrencies.length === 0) return;
        
        if (!availableCurrencies.includes(currentCurrency)) {
          currentCurrency = availableCurrencies.includes('TWD') ? 'TWD' : availableCurrencies[0];
        }
        
        availableCurrencies.forEach(c => {
          const btn = document.createElement('button');
          btn.className = `currency-tab ${c === currentCurrency ? 'active' : ''}`;
          btn.innerText = c;
          btn.onclick = () => switchCurrencyView(c);
          tabsContainer.appendChild(btn);
        });
        
        renderSettlementView(currentCurrency);
    }

    function switchCurrencyView(currency) {
      currentCurrency = currency;
      const tabsContainer = document.getElementById('currencyTabsContainer');
      Array.from(tabsContainer.children).forEach(btn => {
        if (btn.innerText === currency) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      renderSettlementView(currency);
    }

    function renderSettlementView(currency) {
      const data = currentSettlementData[currency];
      if (!data) return;
      
      document.getElementById('totalExpenseAmount').innerText = data.totalExpense.toLocaleString();
      document.getElementById('publicFundAmount').innerText = data.publicFundBalance.toLocaleString();
      document.getElementById('personalExpenseAmount').innerText = (data.personalExpense || 0).toLocaleString();
      
      const balancesList = document.getElementById('balancesList');
      balancesList.innerHTML = '';
      
      data.balances.sort((a, b) => b.netBalance - a.netBalance);
      
      data.balances.forEach(b => {
        let color = 'var(--text-main)';
        let sign = '';
        if (b.netBalance > 0) {
           color = 'var(--primary)';
           sign = '+';
        } else if (b.netBalance < 0) {
           color = '#e11d48';
        }
        
        const isMe = (b.userId === currentUser.userId);
        const item = document.createElement('div');
        item.style.cssText = `display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px;`;
        
        let html = `
          <div>
            <div style="font-weight: 600; font-size: 16px;">
              ${b.userName} ${isMe ? '<span style="font-size:12px;color:var(--text-muted); margin-left:4px;">(我)</span>' : ''}
            </div>
            <div style="font-size: 18px; font-family: monospace; font-weight: bold; color: ${color}; margin-top: 4px;">
              ${sign}${b.netBalance.toLocaleString()} <span style="font-size:12px;">${currency}</span>
            </div>
          </div>
        `;
        
        if (!isMe) {
          html += `
            <button type="button" onclick="openTransferModal('${b.userId}', '${b.userName}')" style="background:#f1f5f9; color:var(--text-main); border:1px solid var(--border); padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;">
              💸 轉帳
            </button>
          `;
        }
        
        item.innerHTML = html;
        balancesList.appendChild(item);
      });

      const publicFundItem = document.createElement('div');
      publicFundItem.style.cssText = `display: flex; justify-content: space-between; align-items: center; padding: 16px; background: rgba(6, 199, 85, 0.05); border: 1px dashed var(--primary); border-radius: 12px; margin-top: 16px;`;
      publicFundItem.innerHTML = `
          <div style="font-weight: 600; font-size: 16px; color: var(--primary);">
            🌟 共同公費包
          </div>
          <button type="button" onclick="openTransferModal('公費', '公費', true)" style="background:var(--primary); color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;">
            ➕ 儲值公費
          </button>
      `;
      balancesList.appendChild(publicFundItem);
    }

    // --- 記帳歷史紀錄載入 ---
    async function loadExpensesData() {
      toggleOverlay(true, "更新紀錄中...");
      const res = await apiCall('getExpenses', { groupId: currentGroupId });
      toggleOverlay(false);
      if (res.success) {
        cachedExpenses = res.expenses;
        renderExpensesData(res.expenses);
      } else {
        alert("載入紀錄失敗：" + res.message);
      }
    }
    
    function renderExpensesData(expenses) {
      const list = document.getElementById('expensesList');
      list.innerHTML = '';
      
      if (!expenses || expenses.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:40px;">目前還沒有任何記帳紀錄喔！<br>趕快按下右下角的 ➕ 新增一筆吧。</p>';
        return;
      }
      
      expenses.forEach(exp => {
        let payerName = exp.payerId === '公費' ? '🌟 公費' : (groupMembers.find(m => m.userId === exp.payerId)?.userName || '未知');
        let dateObj = new Date(exp.time);
        let timeStr = isNaN(dateObj.getTime()) ? exp.time : dateObj.toLocaleString([], {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
        
        let notesHtml = exp.notes ? `<div style="margin-top:8px; padding:8px; background:var(--input-bg); border-radius:8px; font-size:12px; color:#555; word-break:break-all; white-space:pre-wrap;">📝 ${exp.notes}</div>` : '';
        
        const card = document.createElement('div');
        card.className = 'history-card';
        card.onclick = () => openExpenseDetail(exp); // 第八階段：開啟詳細視窗
        
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 8px;">
            <span style="font-weight:600; font-size:15px; display:flex; align-items:center; gap:6px;">
              ${exp.category.substring(0,2)} ${exp.item}
            </span>
            <span style="font-weight:bold; color:var(--text-main); font-family:monospace; font-size:16px;">
              ${exp.amount.toLocaleString()} <span style="font-size:12px;">${exp.currency}</span>
            </span>
          </div>
          <div style="font-size:13px; color:var(--text-muted); display:flex; justify-content:space-between;">
            <span>💳 代墊：${payerName}</span>
            <span>${timeStr}</span>
          </div>
          ${notesHtml}
        `;
        list.appendChild(card);
      });
    }

    // --- 第八階段：歷史紀錄詳細視窗 (個別結清/刪除/編輯) ---
    function openExpenseDetail(exp) {
      document.getElementById('detailItem').innerText = `${exp.category.substring(0,2)} ${exp.item}`;
      document.getElementById('detailAmount').innerText = exp.amount.toLocaleString();
      document.getElementById('detailCurrency').innerText = exp.currency;
      
      let dateObj = new Date(exp.time);
      let timeStr = isNaN(dateObj.getTime()) ? exp.time : dateObj.toLocaleString();
      document.getElementById('detailTime').innerText = timeStr;
      
      let payerName = exp.payerId === '公費' ? '🌟 公費' : (groupMembers.find(m => m.userId === exp.payerId)?.userName || '未知');
      document.getElementById('detailPayer').innerText = `💳 代墊：${payerName}`;
      
      if (exp.notes) {
        // 使用 innerText 可以自然保留 \n，搭配 white-space: pre-wrap
        document.getElementById('detailNotes').innerText = `📝 備註：\n${exp.notes}`;
        document.getElementById('detailNotes').style.display = 'block';
      } else {
        document.getElementById('detailNotes').style.display = 'none';
      }
      
      const splitsList = document.getElementById('detailSplitsList');
      splitsList.innerHTML = '';
      
      if (exp.splits && exp.splits.length > 0) {
        exp.splits.forEach(s => {
          let sName = groupMembers.find(m => m.userId === s.userId)?.userName || '未知';
          let isSelf = (s.userId === exp.payerId) || (exp.payerId === '公費');
          let disabledAttr = isSelf ? 'disabled' : '';
          let checkedAttr = s.isSettled ? 'checked' : '';
          
          let html = `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px;">
              <div style="font-size:14px; font-weight:600;">
                ${sName} <span style="font-size:12px; color:var(--text-muted); font-weight:normal; font-family:monospace; margin-left:4px;">應付 ${s.amount}</span>
              </div>
              <label style="display:flex; align-items:center; font-size:13px; cursor:${isSelf ? 'not-allowed' : 'pointer'};">
                <input type="checkbox" ${checkedAttr} ${disabledAttr} onchange="submitToggleSettle('${exp.expenseId}', '${s.userId}', this.checked)" style="margin-right:6px; accent-color:var(--primary); width:16px; height:16px;">
                ${s.isSettled ? '<span style="color:var(--primary);font-weight:bold;">已結清</span>' : '<span style="color:var(--text-muted);">未結清</span>'}
              </label>
            </div>
          `;
          splitsList.innerHTML += html;
        });
      }
      
      document.getElementById('btnDeleteExpense').onclick = () => deleteExpenseConfirm(exp.expenseId);
      document.getElementById('btnEditExpense').onclick = () => openEditExpenseForm(exp);
      
      document.getElementById('expenseDetailModal').style.display = 'flex';
    }

    async function submitToggleSettle(expenseId, debtorId, isSettled) {
      toggleOverlay(true, "更新結清狀態中...");
      const res = await apiCall('toggleSettleStatus', {
        expenseId: expenseId,
        debtorId: debtorId,
        isSettled: isSettled
      });
      if (res.success) {
        toggleOverlay(false);
        // 更新成功後，背景重新整理資料
        await enterGroup(currentGroupId, currentGroupName); 
        document.getElementById('expenseDetailModal').style.display = 'none';
      } else {
        toggleOverlay(false);
        alert("更新失敗：" + res.message);
      }
    }

    async function deleteExpenseConfirm(expenseId) {
      if (!confirm('確定要刪除這筆帳目嗎？此動作無法復原！')) return;
      toggleOverlay(true, "刪除中...");
      const res = await apiCall('deleteExpense', { expenseId: expenseId, groupId: currentGroupId });
      if (res.success) {
        toggleOverlay(false);
        document.getElementById('expenseDetailModal').style.display = 'none';
        await enterGroup(currentGroupId, currentGroupName); // 重新載入
      } else {
        toggleOverlay(false);
        alert("刪除失敗：" + res.message);
      }
    }

    function openEditExpenseForm(exp) {
      showExpenseForm(true); // 進入編輯模式
      document.getElementById('editExpenseId').value = exp.expenseId;
      
      let dateObj = new Date(exp.time);
      if (!isNaN(dateObj.getTime())) {
         dateObj.setMinutes(dateObj.getMinutes() - dateObj.getTimezoneOffset());
         document.getElementById('time').value = dateObj.toISOString().slice(0, 16);
      }
      
      document.querySelector(`input[name="category"][value="${exp.category}"]`).checked = true;
      document.getElementById('item').value = exp.item;
      document.querySelector(`select[name="currency"]`).value = exp.currency;
      document.getElementById('amount').value = exp.amount;
      document.getElementById('payer').value = exp.payerId;
      document.getElementById('notes').value = exp.notes || '';
      
      let splitArray = exp.splitUsers.split(',');
      document.querySelectorAll('input[name="splitUsers"]').forEach(cb => {
        cb.checked = splitArray.includes(cb.value);
      });
    }

    // --- 轉帳與儲值 Modal 邏輯 ---
    function openTransferModal(targetId, targetName, isPublicFund = false) {
      currentTransferTarget = { id: targetId, name: targetName, isPublicFund: isPublicFund };
      document.getElementById('modalTitle').innerText = isPublicFund ? '儲值公費' : '轉帳還款';
      document.getElementById('modalDesc').innerText = isPublicFund ? '請輸入您要存入公費包的金額：' : `請輸入您要轉給「${targetName}」的金額：`;
      
      document.getElementById('modalCurrencyLabel').innerText = `金額 (${currentCurrency})`;
      
      // 自動預填金額邏輯
      let suggestAmount = '';
      if (!isPublicFund && currentSettlementData[currentCurrency] && currentSettlementData[currentCurrency].balances) {
        const targetBalanceObj = currentSettlementData[currentCurrency].balances.find(b => b.userId === targetId);
        const myBalanceObj = currentSettlementData[currentCurrency].balances.find(b => b.userId === currentUser.userId);
        
        if (targetBalanceObj && myBalanceObj) {
          // 如果對方是被欠錢 (餘額>0)，且我是欠錢 (餘額<0)
          if (targetBalanceObj.netBalance > 0 && myBalanceObj.netBalance < 0) {
            suggestAmount = Math.min(targetBalanceObj.netBalance, Math.abs(myBalanceObj.netBalance));
          } 
          // 否則如果對方就是被欠錢，預填他被欠的全部數字
          else if (targetBalanceObj.netBalance > 0) {
            suggestAmount = targetBalanceObj.netBalance;
          }
          // 否則如果我欠錢，預填我欠的全部數字
          else if (myBalanceObj.netBalance < 0) {
            suggestAmount = Math.abs(myBalanceObj.netBalance);
          }
        }
      }
      
      document.getElementById('transferAmount').value = suggestAmount > 0 ? suggestAmount : '';
      
      // 公費不需要一鍵結清的 Checkbox
      if (isPublicFund) {
        document.getElementById('settleAllCheckboxContainer').style.display = 'none';
      } else {
        document.getElementById('settleAllCheckboxContainer').style.display = 'block';
        document.getElementById('settleAllItemsCheckbox').checked = true; // 預設打勾
      }
      
      document.getElementById('transferModal').style.display = 'flex';
    }

    function closeTransferModal() {
      document.getElementById('transferModal').style.display = 'none';
    }

    async function submitTransfer() {
      const amount = parseFloat(document.getElementById('transferAmount').value);
      if (!amount || amount <= 0) return alert("請輸入有效金額！");
      
      const settleAllItems = document.getElementById('settleAllCheckboxContainer').style.display !== 'none' 
                           ? document.getElementById('settleAllItemsCheckbox').checked 
                           : false;
      
      closeTransferModal();
      toggleOverlay(true, "處理轉帳中...");
      
      const res = await apiCall('addTransfer', {
        groupId: currentGroupId,
        userId: currentUser.userId,
        payerId: currentUser.userId,
        receiverId: currentTransferTarget.id,
        amount: amount,
        currency: currentCurrency,
        settleAllItems: settleAllItems
      });
      
      if (res.success) {
        toggleOverlay(false);
        if (liff.isInClient()) {
            const msg = currentTransferTarget.isPublicFund ? 
              `[${currentGroupName}]\n🌟 ${currentUser.displayName} 儲值了公費 ${currentCurrency} ${amount}！` : 
              `[${currentGroupName}]\n💸 ${currentUser.displayName} 轉帳了 ${currentCurrency} ${amount} 給 ${currentTransferTarget.name}！`;
            liff.sendMessages([{ type: 'text', text: msg }]).catch(e => console.log(e));
        }
        await enterGroup(currentGroupId, currentGroupName); 
      } else {
        toggleOverlay(false);
        alert("處理失敗：" + res.message);
      }
    }

    function shareGroup(view = 'settlement') {
      const shareUrl = `https://liff.line.me/${LIFF_ID}?groupId=${currentGroupId}&view=${view}`;
      const inviteText = `哈囉！邀請您加入記帳群組「${currentGroupName}」！💸\n點擊下方連結立即加入：\n${shareUrl}`;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(inviteText).then(() => {
          alert("邀請文字與連結已複製！請直接貼上傳給 LINE 好友吧。");
        }).catch(err => {
          prompt("複製失敗，請手動複製以下連結：", shareUrl);
        });
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = inviteText;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          alert("邀請文字與連結已複製！請直接貼上傳給 LINE 好友吧。");
        } catch (err) {
          prompt("複製失敗，請手動複製以下連結：", shareUrl);
        }
        document.body.removeChild(textArea);
      }
    }

    // 處理記帳表單送出 (新增與編輯)
    document.getElementById('expenseForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!currentUser || !currentGroupId) {
        alert("狀態錯誤，請重新載入網頁！");
        return;
      }

      const formData = new FormData(this);
      const splitUsers = formData.getAll('splitUsers');

      if (splitUsers.length === 0) {
        alert("請至少選擇一位參與者來分攤！");
        return;
      }

      const editId = formData.get('editExpenseId');
      const actionType = editId ? 'updateExpense' : 'addExpense';

      const postData = {
        expenseId: editId, 
        groupId: currentGroupId,
        recorderId: currentUser.userId,
        time: formData.get('time').replace('T', ' '),
        category: formData.get('category'),
        item: formData.get('item'),
        currency: formData.get('currency'),
        totalAmount: parseFloat(formData.get('amount')),
        payerId: formData.get('payer'),
        splitUsers: splitUsers,
        notes: formData.get('notes')
      };

      toggleOverlay(true, "資料寫入中...");

      const res = await apiCall(actionType, postData);

      if (res.success) {
        toggleOverlay(false);
        if (!editId) {
            const payerName = postData.payerId === '公費' ? '公費' : groupMembers.find(m => m.userId === postData.payerId)?.userName || '未知';
            let msgText = `[${currentGroupName} 記帳]\n${postData.category} ${postData.item}\n金額: ${postData.currency} ${postData.totalAmount}\n代墊: ${payerName}\n分攤: ${splitUsers.length} 人`;
            if (postData.notes) msgText += `\n備註: ${postData.notes}`;
            
            try {
              if (liff.isInClient()) await liff.sendMessages([{ type: 'text', text: msgText }]);
            } catch (err) {
              console.log("LINE 訊息發送失敗", err);
            }
        }
        
        alert(editId ? "編輯成功！" : "記帳成功！");
        document.getElementById('item').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('notes').value = '';
        
        // 記住現在的 tab，以免 enterGroup 強制跳回結算
        const savedTab = currentTab;
        
        // 重新載入群組全部資料以更新畫面
        await enterGroup(currentGroupId, currentGroupName); 
        
        // 恢復原本的畫面
        switchTab(savedTab, true);
      } else {
        toggleOverlay(false);
        alert("記帳寫入失敗：" + res.message);
      }
    });

    // --- 第十階段：AI 掃描發票處理 ---
    async function handleReceiptUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const img = new Image();
      const reader = new FileReader();
      
      reader.onload = function(e) {
        img.src = e.target.result;
      };
      
      img.onload = async function() {
        // --- 1. 壓縮影像 ---
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1024;
        const MAX_HEIGHT = 1024;
        let width = img.width;
        let height = img.height;
        
        if (width > height) {
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
        } else {
          if (height > MAX_HEIGHT) {
            width *= MAX_HEIGHT / height;
            height = MAX_HEIGHT;
          }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        const base64Data = dataUrl.split(',')[1];
        
        // --- 2. 呼叫後端 API 進行辨識 (第十二階段安全升級) ---
        toggleOverlay(true, "✨ AI 正在辨識發票中，請稍候...");
        
        const res = await apiCall('analyzeReceipt', { imageBase64: base64Data });
        
        if (res.success) {
          const text = res.text;
          const notesField = document.getElementById('notes');
          notesField.value = notesField.value ? notesField.value + '\n\n' + text : text;
          alert("掃描成功！已自動填入備註欄。");
        } else {
          alert("掃描失敗：" + res.message);
        }
        
        toggleOverlay(false);
        event.target.value = ''; // 重置 input 檔案
      };
      
      reader.readAsDataURL(file);
    }

    window.onload = initializeApp;
  </script>
